services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notemarkdown
      POSTGRES_USER: notemarkdown
      POSTGRES_PASSWORD: notemarkdown
    ports:
      - "5432:5432"
    volumes:
      - notemarkdown-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notemarkdown -d notemarkdown"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  notemarkdown-postgres:
